name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Windows 控制台默认用 GBK 代码页, 而本项目所有文案是 UTF-8。不设这个变量,
# 打印含中文的输出时可能抛 UnicodeEncodeError。
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest (唯一的测试依赖; 运行时依赖为空)
        run: python -m pip install --upgrade pip "pytest>=7"

      - name: Byte-compile (compileall)
        run: python -m compileall -q bcl tools

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Run standalone self-check
        run: python tools/selfcheck.py

      - name: CLI smoke test (bench)
        run: python -m bcl bench

      - name: Dependency check (AST scan: stdlib only)
        run: python tools/selfcheck.py --deps-only
